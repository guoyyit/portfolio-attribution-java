spring.datasource.url=jdbc:h2:file:./data/portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# 查询事务隔离级别：SNAPSHOT（默认，H2 的 JDBC 级别 6）保证一次查询内的多条
# 读取看到同一个数据库快照；可改为 READ_COMMITTED 或 SERIALIZABLE。
# 进程内另有写/读锁（WriteGuard）串行化写事务并使查询不与写事务并发。
portfolio.query.isolation=SNAPSHOT
